name: Companion module

# Builds the Companion OBS module with the Multidestination Studio presets: upstream
# bitfocus/companion-module-obs-studio at companion/UPSTREAM_COMMIT plus companion/*.patch.
on:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-module.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, check and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream module and apply the patch
        run: |
          git clone https://github.com/bitfocus/companion-module-obs-studio.git module
          cd module
          git checkout "$(cat ../companion/UPSTREAM_COMMIT)"
          git apply ../companion/multidestination-studio.patch

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: module/package.json
          cache: yarn
          cache-dependency-path: module/yarn.lock

      - name: Install dependencies
        working-directory: module
        run: yarn install --immutable

      - name: Format, refresh the option snapshot, keep the resulting patch
        working-directory: module
        run: |
          yarn format
          yarn vitest --run -u src/__tests__/option-shape.test.ts || true
          git add -A
          git diff --cached HEAD > ../multidestination-studio.patch

      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: module
        run: yarn lint

      - name: Types
        if: ${{ !cancelled() }}
        working-directory: module
        run: yarn check-types

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: module
        run: yarn test

      - name: Package
        working-directory: module
        run: |
          npm pkg set version="$(cat ../companion/MODULE_VERSION)"
          yarn package
          mkdir -p ../dist
          cp *.tgz "../dist/companion-obs-studio-multidestination-$(cat ../companion/MODULE_VERSION).tgz"
          ls -la ../dist

      # A .tgz attached to a release (not inside a zip): Companion imports it as is.
      - name: Publish the module package
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete companion-module --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create companion-module dist/*.tgz -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Companion module for Multidestination Studio ($(cat companion/MODULE_VERSION))" \
            --notes-file companion/RELEASE.md --latest=false

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: companion-module-patch
          path: multidestination-studio.patch
