MDS.SettingCompanionMenu="Companion / Stream Deck …"
MDS.SettingCompanion="Companion / Stream Deck"
MDS.SettingCompanionNote="Styr Multidestination Studio fra Bitfocus Companion eller en Stream Deck via obs-websocket (innebygd i OBS). Legg til en <b>OBS Studio</b>-tilkobling i Companion, og bruk:<br>• <b>Set Preview Scene</b>: scenen vises i studioets forhåndsvisning (Scene to PVW). Studiomodus i OBS må være på; det er den så lenge Multidestination Studio er åpent.<br>• <b>Set Program Scene</b>: hver ulåst destinasjon som scenen dekker, tar den (Scene to PGM).<br>• <b>Transition</b>, <b>Set Transition Type</b>, <b>Set Transition Duration</b>: felles med studioet.<br>• <b>Custom Vendor Request</b>, leverandør <b>multidestination-studio</b>: GetState, SetPreviewScene, SetProgramScene, Transition, Cut, SetPreviewCue, GoCue, StopCue. Felt: sceneName, cueName, transitionName, duration, cut.<br>• <b>Trigger Hotkey by ID</b>: studioets hurtigtaster for Overgang og Kutt."
MDS.SettingFollowPreview="Følg forhåndsvisningsscenen i OBS (Scene to PVW)"
MDS.SettingFollowProgram="Følg programscenen i OBS (Scene to PGM): hver destinasjon tar en scene som settes på lufta i OBS"
MDS.SettingCuesMenu="Cues …"
MDS.SettingCues="Cues"
MDS.SettingCuesNote="Cues sender flere scener på lufta etter hverandre, som en cueliste i et showkontrollprogram. Hver scene i en cue har en <b>ventetid før</b> (venting før den går på lufta), sin egen <b>overgang</b> og <b>varighet</b>, og en <b>ventetid etter</b> (venting før neste scene).<br>Klikk på en cue for å vise den første scenen i forhåndsvisningen, og trykk deretter <b>Overgang</b> eller <b>Kutt</b> for å kjøre den. Cues-dokken plasseres mellom Kilder og Mediekontroller."
